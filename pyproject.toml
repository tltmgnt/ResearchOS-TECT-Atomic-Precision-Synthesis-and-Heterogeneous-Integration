[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-tect-hi"
version = "0.1.0"
description = "Reproducible synthesis records and evidence-linked heterogeneous integration research"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
researchos-hi = "researchos_hi.cli:main"

[tool.setuptools.packages.find]
include = ["researchos_hi*"]
